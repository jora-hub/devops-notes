apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx # Тот самый радар! Ищем поды с таким ярлыком.
  ports:
    - port: 80         # Порт самого Сервиса
      targetPort: 80   # Дверь внутри контейнера Nginx
      nodePort: 30080  # Дверь, которую мы открываем на нашей Ubuntu (разрешены от 30000 до 32767)
